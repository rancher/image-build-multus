---
name: "Update multus version" 

sources:
 multus:
   name: Get multus version
   kind: githubrelease
   spec:
     owner: k8snetworkplumbingwg
     repository: multus-cni
     token: '{{ requiredEnv .github.token }}'
     typefilter:
       release: true
       draft: false
       prerelease: false
     versionfilter:
       kind: semver

targets:
  tagfile:
    name: "Bump to latest multus version in TAG"
    kind: file
    sourceid: multus
    scmid: default
    spec:
      file: TAG
      matchpattern: '(?m)^(.+)$'

scms:
  default:
    kind: github
    spec:
      token: '{{ requiredEnv .github.token }}'
      username: '{{ requiredEnv .github.username }}'
      user: '{{ .github.user }}'
      email: '{{ .github.email }}'
      owner: '{{ .github.owner }}'
      repository: '{{ .github.repository }}'
      branch: '{{ .github.branch }}'

actions:
  default:
    title: 'Bump multus version to {{ source "multus" }}'
    kind: github/pullrequest
    spec:
      automerge: false
      labels:
        - updatecli
        - status/auto-created
    scmid: default
